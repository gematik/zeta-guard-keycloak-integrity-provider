name: "keycloak-encryption"

networks:
  keycloak-encryption-network:
    name: keycloak-encryption-network

services:
  keycloak-db:
    image: postgres:17-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: wasadmin
      POSTGRES_PASSWORD: geheim
    networks:
      - keycloak-encryption-network
    ports:
      - "15432:5432"
    healthcheck:
      test: pg_isready -h localhost -p 5432 -U wasadmin -d keycloak
      interval: 3s
      timeout: 3s
      retries: 5
#    command: postgres -c lock_timeout=1000 -c statement_timeout=5000


  keycloak:
    image: spree/keycloak/keycloak-encryption
    container_name: keycloak
    environment:
      PRINT_ENV: true
      JAVA_LOCALE: -Duser.timezone=Europe/Berlin
      JAVA_OPTS_APPEND: -ea
      KC_DEBUG: true
      KC_DEBUG_PORT: "*:8787"
      KC_DEBUG_SUSPEND: ${KC_DEBUG_SUSPEND:-n}
      KC_TRACING_ENABLED: true

      # Put Keycloak build options in the first build stage of the container image
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: wasadmin
      KC_DB_PASSWORD: geheim
      KC_BOOTSTRAP_ADMIN_USERNAME: wasadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: wasadmin
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: http://localhost:18080
      KC_HTTP_ENABLED: true
      # SPREE_SCANNER_INTERVAL: "PT1M"
      # SPREE_SCANNER_DELAY: "PT10M"
      SPREE_SCANNER_INTERVAL: "PT10S"
      SPREE_SCANNER_DELAY: "PT1M"
      HSM_PROXY_ENDPOINT: "hsm-sim:50051"
      HSM_PROXY_KEK_ID: "vau-db-kek-v1"
      SPREE_ENCRYPTED_REALM: "encrypted-realm"
      SPREE_BOOTSTRAP_INTERVAL: "PT20S"
      # SPREE_FUTURE_KEYCHAIN_FILE: "/opt/keycloak/conf/keychain3.env"
      SPREE_KEYCHAIN_FILE: "/opt/keycloak/conf/keychain.env"
      # SPREE_PREVIOUS_KEYCHAIN_FILE: "/opt/keycloak/conf/keychain2.env"
      SPREE_INTEGRITY_PROVIDER_ENABLED: "true"
      SPREE_ENABLE_INTEGRITY_CHECK: "true"
      SPREE_AUTOMATIC_CRYPTO_UPDATE: "true"
    ports:
      - "127.0.0.1:18787:8787" # debug port
      - "127.0.0.1:18080:8080" # api port
    networks:
      - keycloak-encryption-network
    volumes:
      - ./conf/keychain.env:/opt/keycloak/conf/keychain.env
      - ./conf/keychain2.env:/opt/keycloak/conf/keychain2.env
      - ./conf/keychain3.env:/opt/keycloak/conf/keychain3.env
      - ./log:/opt/keycloak/data/log
    healthcheck:
      # No curl in Keycloak 🙄
      test: |
        exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nhost: localhost:9000\r\nConnection: close\r\n\r\n" >&3;grep "HTTP/1.1 200 OK" <&3
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy
      hsm-sim:
        condition: service_started
    command: start --log="console,file" --import-realm --verbose --optimized
  # DEBUG Logging
  #--log-level=org.keycloak:DEBUG --log-level="INFO,org.hibernate.SQL:debug"

  hsm-sim:
    image: ${HSM_SIM_IMAGE:-zeta/zeta-guard/ngx_pep/hsm_sim}:${HSM_SIM_TAG:-main}
    container_name: hsm-sim
    command: ["--listen", "0.0.0.0:50051", "--keys-dir", "/etc/hsm_sim/keys"]
    ports:
      - "127.0.0.1:50051:50051" # api port
    networks:
      - keycloak-encryption-network
